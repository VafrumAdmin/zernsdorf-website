name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 76.13.7.34
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd /home/deploy/zernsdorf-website
            git stash
            git pull origin main
            npm install
            npm run build
            pm2 restart zernsdorf
            echo "Deployment complete!"
